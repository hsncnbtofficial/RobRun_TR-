[project]
name = "robrun-tr"
version = "1.3.0"
description = "ROB RUN için açık kaynak Türkçe yama, Türkçe font desteği ve suç rehberi"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mss>=10.2.0",
    "numpy>=2.5.5",
    "psutil>=7.2.2",
    "pywebview>=6.2.1",
    "pywin32>=312",
    "scipy>=1.18.1",
    "unitypy>=1.25.4",
    "winrt-runtime>=4.2.0",
    "winrt-windows-foundation>=4!10.0.28000.2957",
    "winrt-windows-foundation-collections>=4!10.0.28000.2957",
    "winrt-windows-globalization>=4!10.0.28000.2957",
    "winrt-windows-graphics-imaging>=4!10.0.28000.2957",
    "winrt-windows-media-ocr>=4!10.0.28000.2957",
    "winrt-windows-storage-streams>=4!10.0.28000.2957",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
# scripts are run directly (app/main.py, robrun_tr/*.py); nothing to build as a package
package = false
